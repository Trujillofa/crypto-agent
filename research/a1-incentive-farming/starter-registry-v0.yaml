  classification: [IN_CORE, IN_CONDITIONAL, YIELD_ONLY, DEFER, REJECT]
  # selection_criteria booleans map to docs/specs/a1-incentive-farming-pilot-v0.md "SELECTION CRITERIA"
  selection_criteria: [c1_fixed_or_capped, c2_terms_documented, c3_eligibility_public,
                       c4_capital_bounded, c5_tail_named, c6_reward_rationale]

