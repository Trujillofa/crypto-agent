# A1 Phase-0 Starter Registry v0 — classification test fixture
# Spec: docs/specs/a1-incentive-farming-pilot-v0.md
# Drafted: 2026-06-27 (planner = Claude/Codex). NO capital deployed, NO code built.
#
# ============================ READ THIS FIRST (honesty boundary) ============================
# PURPOSE: a SEED set of 17 real program ARCHETYPES spanning every classification tier
# (IN_CORE / IN_CONDITIONAL / YIELD_ONLY / DEFER / REJECT) so Grok can test the *classifier*,
# not just attractive examples. It deliberately includes rejected and conditional candidates.
#
# WHAT IS TRUSTWORTHY HERE:
#   - distribution_mechanism + classification + classification_reason: web-verified this session
#     against official/primary sources (verification_status: MECHANISM_VERIFIED_2026-06-27).
#   - official_source_url: real URLs observed 2026-06-27 (some marked URL_UNVERIFIED — confirm).
#
# WHAT IS *NOT* TRUSTWORTHY AND MUST BE RE-FETCHED BEFORE ANY CAPITAL DECISION:
#   - Whether a specific round/season is OPEN right now, current reward sizes, exact eligibility
#     windows, and current sybil/jurisdiction terms. These move weekly. Marked
#     live_round_status: UNVERIFIED unless noted. Training cutoff is 2026-01; treat live detail as stale.
#   - snapshot_sha256: PENDING_TOOL_CAPTURE on every entry. A genuine frozen hash must be computed
#     from the raw fetched bytes by Grok's Phase-0 snapshot tool at fetch time; it cannot be
#     hand-authored. Do not fabricate one.
#
# review_expiry = 2026-07-11 on all entries (matches the 2-week paper-inventory window); re-verify
# or expire each record by then.
# ===========================================================================================

schema_version: 0
drafted_at: 2026-06-27
review_window_days: 14
default_review_expiry: 2026-07-11

# Field dictionary (the loader Grok builds should validate against this)
field_dictionary:
