# =====================================================================
# EV INPUTS SIDECAR — binance-learn-and-earn   (IN_CORE)
# Gates: actionability.py::_has_acceptable_provenance + ev.py::compute_ev
# (reminder: this candidate is also BLOCKED AT GATE 1 until captured — see its
#  verification sidecar. EV can be filled in parallel but cannot promote first.)
#
# Net_EV = P(elig)*P(dist)*reward_qty*realizable_price*liq_vesting_haircut   (speculative)
#          + base_yield - gas_bridge_fees
#          - opportunity_cost(capital*days vs benchmark_apy)
#          - expected_loss_reserve - manual_hours*hourly_rate
#
# To pass Gate 4: set readiness=READY, REPLACE every number with a measured value,
# and give every provenance entry a real "<source>, <date>" string.
# BANNED provenance substrings (auto-reject): unknown, placeholder, from sidecar,
# sourced, test, day-0, conservative, structure.
# PROFILE: Learn-&-Earn pays a FIXED announced token for a quiz — so reward is
# announced (realizable_price = live market price), capital is ~0, and this is
# almost pure labor. EV is dominated by reward_qty*price minus manual_hours*rate.
# =====================================================================
id: binance-learn-and-earn
reward_announced: true               # FILL: Learn-&-Earn rewards are announced fixed tokens; keep true
reward_type: announced_fixed_token   # keep unless the terms describe a different mechanism

# --- material inputs: REPLACE each estimate with a measured value ---
p_eligibility: 0.55          # REPLACE: P(you qualify) — usually high if KYC done + quota open (-> ~0.9+)
p_distribution: 0.45         # REPLACE: P(reward distributes) — typically high for completed Learn-&-Earn
reward_qty: 25.0             # REPLACE: fixed reward token quantity stated on the course page
realizable_price: 0.4        # REPLACE: live market $ price of the reward token (it is announced)
liquidity_vesting_haircut: 0.5  # REPLACE: usually ~1.0 (liquid, little/no vesting) — confirm
base_yield: 1.5              # REPLACE: usually 0 unless a locked-product variant; confirm
gas_bridge_fees: 4.0         # REPLACE: usually ~0 (rewarded in Binance account, no on-chain claim)
capital: 40.0                # REPLACE: usually ~0 capital at risk; note caps gate needs capital > 0 to evaluate
days: 14.0                   # REPLACE: days any capital is committed (often 0 for a quiz)
benchmark_apy: 0.05          # REPLACE: stablecoin/cash benchmark APY for opportunity cost
expected_loss_reserve: 5.0   # REPLACE: typically ~0 (custodial, no contract risk) — confirm
manual_hours: 2.0            # REPLACE: time to watch course + quiz + sell (the dominant cost here)
hourly_rate: 40.0            # REPLACE: $/hr you value your time at

readiness: UNREADY           # FILL: flip to READY only when ALL provenance below is real evidence

provenance:                  # FILL each "<evidence source>, <YYYY-MM-DD>" — NO banned words, none empty
  p_eligibility: ""          # FILL: course eligibility + your KYC/quota status
  p_distribution: ""         # FILL: historical/stated distribution reliability
  reward_qty: ""             # FILL: fixed reward stated on the course page
  realizable_price: ""       # FILL: reward token price venue + date
  liquidity_vesting_haircut: ""  # FILL: lock/vesting terms (likely none)
  base_yield: ""             # FILL: yield source, or note "none" with basis
  gas_bridge_fees: ""        # FILL: claim/withdrawal cost basis
  capital: ""                # FILL: capital required per terms (likely ~0)
  days: ""                   # FILL: any lock period
  benchmark_apy: ""          # FILL: benchmark instrument + rate date
  expected_loss_reserve: ""  # FILL: custody risk basis
  manual_hours: ""           # FILL: time estimate basis
  hourly_rate: ""            # FILL: your rate basis
notes: ""
