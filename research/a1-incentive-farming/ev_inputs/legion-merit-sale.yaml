# =====================================================================
# EV INPUTS SIDECAR — legion-merit-sale   (IN_CORE)
# Gates: actionability.py::_has_acceptable_provenance + ev.py::compute_ev
#
# Net_EV = P(elig)*P(dist)*reward_qty*realizable_price*liq_vesting_haircut   (speculative)
#          + base_yield - gas_bridge_fees
#          - opportunity_cost(capital*days vs benchmark_apy)
#          - expected_loss_reserve - manual_hours*hourly_rate
#
# To pass Gate 4: set readiness=READY, REPLACE every number with a measured value,
# and give every provenance entry a real "<source>, <date>" string.
# BANNED provenance substrings (auto-reject): unknown, placeholder, from sidecar,
# sourced, test, day-0, conservative, structure.
# BASE-CASE RULE: if the reward is NOT officially announced, set realizable_price=0.
# WATCH: Legion allocation depends on a "merit score" — if that formula is
# undisclosed, selection criterion #3 fails and p_eligibility is unmeasurable.
# =====================================================================
id: legion-merit-sale
reward_announced: true               # FILL: true only if reward officially announced; if false -> realizable_price: 0.0
reward_type: announced_fixed_token   # keep unless the terms describe a different mechanism

# --- material inputs: REPLACE each estimate with a measured value ---
p_eligibility: 0.55          # REPLACE: P(your merit score qualifies) 0-1 — needs the disclosed formula
p_distribution: 0.45         # REPLACE: P(reward actually distributes) 0-1
reward_qty: 60.0             # REPLACE: expected allocation token quantity per sale terms
realizable_price: 0.4        # REPLACE: conservative $ you could actually SELL at (0 if unannounced)
liquidity_vesting_haircut: 0.5  # REPLACE: 0-1 fraction surviving vesting/illiquidity (1.0 = none)
base_yield: 1.5              # REPLACE: $ contractual yield that pays even if reward = 0 (often 0 for a sale)
gas_bridge_fees: 4.0         # REPLACE: $ total gas + bridge cost to participate + claim + exit
capital: 60.0                # REPLACE: $ capital at risk (CAP: <= $250/protocol, <= $1000 total)
days: 14.0                   # REPLACE: days capital is committed/locked
benchmark_apy: 0.05          # REPLACE: stablecoin/cash benchmark APY for opportunity cost
expected_loss_reserve: 5.0   # REPLACE: $ reserve for contract/custody/depeg tail
manual_hours: 2.0            # REPLACE: hours of hands-on work (merit tasks, allocation, claim, sell)
hourly_rate: 40.0            # REPLACE: $/hr you value your time at

readiness: UNREADY           # FILL: flip to READY only when ALL provenance below is real evidence

provenance:                  # FILL each "<evidence source>, <YYYY-MM-DD>" — NO banned words, none empty
  p_eligibility: ""          # FILL: disclosed merit-score formula + your current score
  p_distribution: ""         # FILL: basis for distribution probability
  reward_qty: ""             # FILL: sale terms allocation math
  realizable_price: ""       # FILL: price venue/oracle + date (or token unannounced -> 0)
  liquidity_vesting_haircut: ""  # FILL: vesting schedule + liquidity assessment
  base_yield: ""             # FILL: yield source, or note "none" with basis
  gas_bridge_fees: ""        # FILL: chain + measured/estimated fee
  capital: ""                # FILL: chosen deployment amount + rationale
  days: ""                   # FILL: lock period per terms
  benchmark_apy: ""          # FILL: benchmark instrument + rate date
  expected_loss_reserve: ""  # FILL: basis for the reserve
  manual_hours: ""           # FILL: time estimate basis
  hourly_rate: ""            # FILL: your rate basis
notes: ""
