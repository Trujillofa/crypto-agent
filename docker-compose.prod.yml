# Production Docker Compose configuration
# Usage: docker-compose -f docker-compose.prod.yml up -d

x-agent-common: &agent-common
  build:
    context: .
    dockerfile: Dockerfile.prod
  restart: always
  depends_on:
    timescaledb:
      condition: service_healthy
    prometheus:
      condition: service_healthy
  env_file:
    - .env
  environment:
    POSTGRES_HOST: timescaledb
    POSTGRES_PORT: "5432"
    PROMETHEUS_PORT: "8000"
  volumes:
    - agent-data:/app/data
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
      reservations:
        cpus: "0.1"
        memory: 64M
  networks:
    - crypto-net
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - crypto-net
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  prometheus:
    image: prom/prometheus:v2.47.0
    restart: always
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - crypto-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - crypto-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # === Trading Agents (all use Dockerfile.prod — no bind mounts) ===

  agent:
    <<: *agent-common
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      PROMETHEUS_PORT: "8000"
      AGENT_ID: default
      SETTINGS_PATH: config/settings.yaml
    ports:
      - "127.0.0.1:18000:8000"

  agent_2:
    <<: *agent-common
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      PROMETHEUS_PORT: "8000"
      AGENT_ID: agent2
      SETTINGS_PATH: config/settings.agent2.yaml

  agent_btc:
    <<: *agent-common
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      PROMETHEUS_PORT: "8000"
      AGENT_ID: btc-4h
      SETTINGS_PATH: config/settings.btc-4h.yaml

  agent_btc_mtf:
    <<: *agent-common
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      PROMETHEUS_PORT: "8000"
      AGENT_ID: btc-1h-mtf
      SETTINGS_PATH: config/settings.btc_1h_mtf.yaml

  agent_avax:
    <<: *agent-common
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      PROMETHEUS_PORT: "8000"
      AGENT_ID: avax-4h-ma
      SETTINGS_PATH: config/settings.avax_4h_ma.yaml

  agent_sol_sparse:
    <<: *agent-common
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      PROMETHEUS_PORT: "8000"
      AGENT_ID: sol-trend-pullback-sparse
      SETTINGS_PATH: config/settings.sol_trend_pullback_sparse.yaml

  agent_sentiment_macro:
    <<: *agent-common
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      PROMETHEUS_PORT: "8000"
      AGENT_ID: sentiment-macro-bot
      SETTINGS_PATH: config/settings.sentiment_macro.yaml

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - grafana
      - prometheus
    networks:
      - crypto-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  timescaledb-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  agent-data:
    driver: local

networks:
  crypto-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
