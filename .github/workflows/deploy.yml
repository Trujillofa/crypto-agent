name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: gha-crypto-agent-deploy-${{ github.run_id }}

      - name: Execute deployment via SSH
        env:
          SSH_HOST: ${{ secrets.HETZNER_TAILSCALE_HOST }}
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Verify Tailscale can reach the host before attempting SSH
          echo "Pinging $SSH_HOST via Tailscale..."
          tailscale ping --timeout 10s "$SSH_HOST" || { echo "Tailscale cannot reach $SSH_HOST — check HETZNER_TAILSCALE_HOST secret and server Tailscale status"; exit 1; }

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@$SSH_HOST << 'DEPLOY'
          cd /opt/crypto-agent
          git fetch origin main
          git pull --ff-only origin main
          # Rebuild only agent containers; leave DB/monitoring untouched
          docker compose -f docker-compose.prod.yml up -d --build agent_sol_sparse agent_sentiment_macro agent_avax
          sleep 120
          # Check for any unhealthy agent containers. Fail the deploy if found.
          if docker compose -f docker-compose.prod.yml ps agent_sol_sparse agent_sentiment_macro agent_avax | grep "unhealthy"; then
            echo "Error: One or more agent containers are unhealthy."
            docker compose -f docker-compose.prod.yml ps
            exit 1
          fi
          docker image prune -f
          DEPLOY

      - name: Send Telegram Notification on Success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Deployment Successful!
            Repo: ${{ github.repository }}
            3 agents are running and healthy: agent_sol_sparse, agent_sentiment_macro, agent_avax

      - name: Send Telegram Notification on Failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Deployment Failed!
            Repo: ${{ github.repository }}
            Check GitHub Actions logs for details.
