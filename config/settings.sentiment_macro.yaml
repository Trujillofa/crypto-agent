agent_id: sentiment-macro-bot
display_name: sentiment-macro-1h-multiasset

# Live trading: enabled for Stage D (2026-04-16).
# Budget: $6/trade, spot only. 25% max_position_pct to fit 3x $6 positions on ~$43 balance.
# Overriding the 100-trade decision gate (currently at 49 post-fix trades, -20% DD)
# per user directive. Reassess after first live round-trip.
mode: live

trading:
  pairs:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
  timeframe: 1h

telegram:
  daily_summary_enabled: true

ai:
  enabled: true
  polling_interval: 60.0

trading_execution:
  test_mode: false
  use_atr_sizing: false
  order_size_usdt: 6.0
  exit_rules:
    time_stop_minutes: 1440

futures:
  enabled: false
  symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT

strategy:
  default_trading_mode: spot
  evaluation_interval_seconds: 3600
  strategies:
    - name: sentiment_mean_reversion
      config:
        rsi_oversold: 35.0
        rsi_overbought: 65.0
        bb_distance_threshold: 0.005
        sentiment_gate_threshold: 35.0
        sentiment_panic_threshold: 20.0
        sentiment_boost_threshold: 65.0
  global_trend_filter_buffer_pct: 0.0
  aggregator:
    buy_threshold: 0.6
    sell_threshold: -0.6
    btc_regime_filter_enabled: false
