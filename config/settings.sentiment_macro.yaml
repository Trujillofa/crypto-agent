agent_id: sentiment-macro-bot

reconciliation:
  on_divergence: auto_fix
  periodic_interval_seconds: 300  # re-check every 5 min while running
display_name: sentiment-macro-1h-multiasset

# Live trading: rolled back to futures on 2026-04-20 (was spot-only Stage D Apr 16-20).
# Rationale: futures had 95 live trades, 70% WR, +$727 PnL (Mar 13 - Apr 16) vs
# spot's 3 entries / 0 round-trips / -$0.51 realized. Futures track record is the edge.
# Budget: $22/trade notional, default_leverage 3x, isolated margin, one-way mode.
# Note: $22 minimum needed — Binance LOT_SIZE truncation can drop $20 order to $18.73.
#
# DISARMED to paper 2026-07-06: vol-filter sweep #101 (2026-06-19) found no setting that
# both trades and holds an edge; consolidation 2026-06-19 ruled sentiment-macro not a
# viable forward vehicle (last 15 live trades: 2W/13L, all longs into a downtrend).
# Container kept running so the xAI sentiment feed keeps recording observations.
# Do NOT re-arm without a new pre-registered validation at corrected costs.
mode: paper

trading:
  pairs:
    - SOLUSDT
  timeframe: 1h

telegram:
  daily_summary_enabled: true

ai:
  enabled: true
  polling_interval: 60.0
  # DeepSeek V4 Pro fallback if xAI is unavailable.
  fallback_model: deepseek-v4-pro

trading_execution:
  enabled: false
  test_mode: true
  use_atr_sizing: false
  order_size_usdt: 22.0
  # Widened SL from 1.5 to 2.0 ATR — old 1.5x was getting clipped by 1h noise.
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 3.5
  exit_rules:
    time_stop_minutes: 1440
    # Keep replay validation aligned with futures ATR SL/TP behavior.
    backtest_use_executor_exit_model: true

futures:
  # enabled stays true so the paper simulator keeps futures signal semantics
  # (mode: paper above never constructs live executors); test_mode: true means
  # even a mode flip would land on the Binance testnet, not real funds.
  enabled: true
  test_mode: true
  default_leverage: 3
  max_leverage: 10
  margin_mode: isolated
  position_mode: one-way
  liquidation_buffer_pct: 5.0
  # Reduce correlated loss clusters across symbols while in drawdown recovery.
  max_concurrent_longs: 1
  # Wait longer after SL before re-entry on the same symbol.
  sl_cooldown_minutes: 240
  symbols:
    - SOLUSDT

strategy:
  default_trading_mode: futures
  evaluation_interval_seconds: 3600
  strategies:
    - name: sentiment_mean_reversion
      config:
        rsi_oversold: 35.0
        rsi_overbought: 65.0
        bb_distance_threshold: 0.005
        sentiment_gate_threshold: 35.0
        sentiment_panic_threshold: 20.0
        sentiment_boost_threshold: 65.0
        volatility_regime_filter: true
        # Threshold based on actual ATR% data: BTC avg ~0.004-0.005, ETH avg ~0.005-0.007
        # 0.005 catches elevated-vol regimes where MR gets chopped
        atr_pct_threshold: 0.005
  # Keep dip buys above EMA200. Historical testing found that the prior 5% buffer
  # materially worsened BTC drawdown by allowing entries during sustained downtrends.
  global_trend_filter_buffer_pct: 0.0
  aggregator:
    buy_threshold: 0.6
    sell_threshold: -0.6
    btc_regime_filter_enabled: false
