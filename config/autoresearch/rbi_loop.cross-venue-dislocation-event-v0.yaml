# RBI lane manifest: cross-venue dislocation standalone event strategy v0
#
# Successor to cross-venue-basis-v1 (closed 2026-06-11: overlay shape rejected 0/30,
# see docs/reports/cross-venue-basis-v1-sweep-2026-06-11.md). This lane tests the
# event-strategy shape the parent probe actually measured: enter on dislocation
# event, exit at fixed horizon, standalone, two-sided.
#
# probe_verdict intentionally empty -> guard recommends RUN_CHEAP_PROBE.
# The probe script (scripts/probe_dislocation_event_strategy.py) must exist before
# RUN_CHEAP_PROBE can execute; see the lane brief Gate 1 for its hard requirements
# (no lookahead thresholds, event dedup + cooldown, net-of-fee returns, two-sided MAE).
#
# Drive with:
#   uv run python scripts/rbi_loop_from_manifest.py --manifest config/autoresearch/rbi_loop.cross-venue-dislocation-event-v0.yaml
# (dry by default; --execute only after human review of the guard decision)

lane_name: cross-venue-dislocation-event-v0
lane_brief: docs/specs/cross-venue-dislocation-event-strategy-v0.md
probe_verdict:

last_result:
overlap_report:

decision_output: research/rbi_loop/cross-venue-dislocation-event-v0/decision.json
report_output: docs/reports/rbi-loop-cross-venue-dislocation-event-v0.md
timeout_seconds: 3600

commands:
  # Sharpened cheap probe (read-only). Writes the verdict JSON; after human review
  # set probe_verdict above to advance the lane.
  RUN_CHEAP_PROBE: >-
    uv run python scripts/probe_dislocation_event_strategy.py
    --venues binance_usdm,bybit
    --symbols BTCUSDT,ETHUSDT,SOLUSDT
    --timeframe 1h
    --start 2024-01-01
    --fee-pct 0.08
    --slippage-pct 0.02
    --verdict-output research/rbi_loop/cross-venue-dislocation-event-v0/probe-verdict.json

  # Bounded autoresearch only after HAS_PULSE + guard allows. The
  # dislocation_event_entry family does not exist yet; it gets implemented (with its
  # own reviewed plan) only if the probe passes. Parameters here are provisional.
  RUN_AUTORESEARCH: >-
    uv run python scripts/autoresearch_loop.py
    --config config/settings.autoresearch.yaml
    --symbol SOLUSDT
    --timeframe 1h
    --train-months 3
    --test-months 2
    --gate-profile standard
    --families dislocation_event_entry
    --max-runs 30

  RUN_BOOTSTRAP_1000: >-
    uv run python scripts/run_autoresearch.py
    --config config/settings.autoresearch.yaml
    --symbol SOLUSDT
    --timeframe 1h
    --train-months 3
    --test-months 2
    --bootstrap 1000
    --gate-profile standard
    --description cross-venue-dislocation-event-v0-b1000

  CHECK_OVERLAP: >-
    uv run python scripts/analyze_entry_overlap.py
    --output docs/reports/rbi-loop-cross-venue-dislocation-event-v0-overlap.json
    --against sol-1h-trend-pullback-overlay-live,sentiment-macro
