    - name: vwap_reversion
      config:
        vwap_atr_multiplier: 1.85
        rsi_oversold: 40
        rsi_overbought: 60
    - name: trend_pullback
      config:
        rsi_reclaim_level: 48
        min_trend_strength_pct: 0.0117
        max_pullback_distance_pct: 0.0177
