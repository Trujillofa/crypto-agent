apiVersion: 1

groups:
  - orgId: 1
    name: trading-agent-alerts
    folder: Trading Agent
    interval: 30s
    rules:
      - uid: agent-ingestion-error-rate
        title: Agent Ingestion Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(ingest_errors_total[5m]))
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.1
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "High agent ingestion error rate"
          description: "Agent error rate is above 0.1 errors/second over the last 5 minutes"
        labels:
          severity: warning
          alert_type: ingestion_error

      - uid: agent-not-reporting
        title: Agent Not Reporting
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: min(up{job="trading-agent"})
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: "Crypto trading agent not reporting"
          description: "At least one configured trading agent is not reporting: {{ $value }}"
        labels:
          severity: critical
          alert_type: agent_down

      - uid: high-memory-usage
        title: High Memory Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(process_resident_memory_bytes{job="trading-agent"})
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 536870912
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "High memory usage detected"
          description: "Max agent memory usage is above 512MB"
        labels:
          severity: warning
          alert_type: resource
