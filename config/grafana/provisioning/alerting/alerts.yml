apiVersion: 1

groups:
  - orgId: 1
    name: trading-agent-alerts
    folder: Trading Agent
    interval: 30s
    rules:
      - uid: agent-ingestion-error-rate
        title: Agent Ingestion Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(ingest_errors_total[5m])
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.1
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "High agent ingestion error rate"
          description: "Agent error rate is above 0.1 errors/second over the last 5 minutes"
        labels:
          severity: warning
          alert_type: ingestion_error

      - uid: agent-not-reporting
        title: Agent Not Reporting
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="trading-agent"}
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: "Crypto trading agent is not reporting"
          description: "The crypto trading agent has stopped responding to health checks"
        labels:
          severity: critical
          alert_type: agent_down

      - uid: high-memory-usage
        title: High Memory Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: process_resident_memory_bytes / 1024 / 1024
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 512
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "High memory usage detected"
          description: "Agent memory usage is above 512MB"
        labels:
          severity: warning
          alert_type: resource
