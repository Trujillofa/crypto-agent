apiVersion: 1

contactPoints:
  - name: Email Alerts
    orgId: 1
    uid: email-alerts
    type: email
    isDefault: false
    settings:
      addresses: trading-alerts@example.com
      singleEmail: false
      subject: "[Grafana Alert] {{ .Status | toUpper }}: {{ .Labels.alertname }}"
      body: |
        {{ range .Alerts }}
        Alert: {{ .Labels.alertname }}
        Status: {{ .Status }}
        Severity: {{ .Labels.severity }}

        Summary: {{ .Annotations.summary }}
        Description: {{ .Annotations.description }}

        Labels:
        {{ range $key, $value := .Labels }}
          {{ $key }}: {{ $value }}
        {{ end }}

        Started at: {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
        {{ if .EndsAt }}
        Ended at: {{ .EndsAt.Format "2006-01-02 15:04:05 MST" }}
        {{ end }}

        ---
        {{ end }}

        View alerts in Grafana: {{ .ExternalURL }}
    disableResolveMessage: false

  - name: Webhook Alerts
    orgId: 1
    uid: webhook-alerts
    type: webhook
    isDefault: false
    settings:
      url: http://localhost:8080/alerts
      httpMethod: POST
      username: ""
      password: ""
      authorizationHeaderCredentials: ""
      authorizationHeaderType: ""
      authorizationHeader: ""
      maxAlerts: 0
      message: |
        {
          "status": "{{ .Status }}",
          "receiver": "{{ .Receiver }}",
          "groupLabels": {{ .GroupLabels }},
          "commonLabels": {{ .CommonLabels }},
          "commonAnnotations": {{ .CommonAnnotations }},
          "externalURL": "{{ .ExternalURL }}",
          "alerts": [
            {{ range .Alerts }}
            {
              "status": "{{ .Status }}",
              "labels": {{ .Labels }},
              "annotations": {{ .Annotations }},
              "startsAt": "{{ .StartsAt.Format "2006-01-02T15:04:05Z07:00" }}",
              "endsAt": "{{ .EndsAt.Format "2006-01-02T15:04:05Z07:00" }}"
            }{{ if not .Last }},{{ end }}
            {{ end }}
          ]
        }
      title: ""
    disableResolveMessage: false

  - name: Discord Alerts
    orgId: 1
    uid: discord-alerts
    type: discord
    isDefault: false
    settings:
      url: ""  # Add your Discord webhook URL here
      title: "[Grafana Alert] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}"
      message: |
        {{ range .Alerts }}
        **Alert:** {{ .Labels.alertname }}
        **Severity:** {{ .Labels.severity }}
        **Symbol:** {{ .Labels.symbol }}

        {{ .Annotations.summary }}
        {{ .Annotations.description }}

        **Started:** {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
        {{ if .EndsAt }}
        **Ended:** {{ .EndsAt.Format "2006-01-02 15:04:05 MST" }}
        {{ end }}
        ---
        {{ end }}
      username: Grafana Alerts
    disableResolveMessage: false

policies:
  - orgId: 1
    receiver: Email Alerts
    group_by: ['alertname', 'symbol', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      # Critical alerts - immediate notification
      - matchers:
          - severity = critical
        receiver: Webhook Alerts
        group_wait: 10s
        repeat_interval: 5m

      # Price alerts - Discord notification
      - matchers:
          - alert_type =~ "price_high|price_low"
        receiver: Discord Alerts
        group_wait: 1m
        repeat_interval: 30m

      # Volume alerts - lower priority
      - matchers:
          - alert_type = volume_spike
        receiver: Email Alerts
        group_wait: 5m
        repeat_interval: 1h

      # System alerts - immediate webhook
      - matchers:
          - alert_type =~ "data_stale|agent_down|system_stale"
        receiver: Webhook Alerts
        group_wait: 10s
        repeat_interval: 2m
