apiVersion: 1

groups:
  - name: crypto_price_alerts
    interval: 30s
    rules:
      # Bitcoin Price Alerts
      - alert: BitcoinPriceAbove100k
        expr: |
          SELECT close_price FROM ohlcv
          WHERE symbol = 'BTCUSDT'
          ORDER BY time DESC LIMIT 1
          > 100000
        for: 1m
        labels:
          severity: warning
          symbol: BTCUSDT
          alert_type: price_high
        annotations:
          summary: "Bitcoin price above $100,000"
          description: "Bitcoin (BTC) is trading at ${{ $value }} which is above the $100,000 threshold."

      - alert: BitcoinPriceBelow90k
        expr: |
          SELECT close_price FROM ohlcv
          WHERE symbol = 'BTCUSDT'
          ORDER BY time DESC LIMIT 1
          < 90000
        for: 5m
        labels:
          severity: critical
          symbol: BTCUSDT
          alert_type: price_low
        annotations:
          summary: "Bitcoin price below $90,000"
          description: "Bitcoin (BTC) has dropped to ${{ $value }} which is below the $90,000 support level."

      # Ethereum Price Alerts
      - alert: EthereumPriceAbove5k
        expr: |
          SELECT close_price FROM ohlcv
          WHERE symbol = 'ETHUSDT'
          ORDER BY time DESC LIMIT 1
          > 5000
        for: 1m
        labels:
          severity: warning
          symbol: ETHUSDT
          alert_type: price_high
        annotations:
          summary: "Ethereum price above $5,000"
          description: "Ethereum (ETH) is trading at ${{ $value }} which is above the $5,000 threshold."

      - alert: EthereumPriceBelow3k
        expr: |
          SELECT close_price FROM ohlcv
          WHERE symbol = 'ETHUSDT'
          ORDER BY time DESC LIMIT 1
          < 3000
        for: 5m
        labels:
          severity: critical
          symbol: ETHUSDT
          alert_type: price_low
        annotations:
          summary: "Ethereum price below $3,000"
          description: "Ethereum (ETH) has dropped to ${{ $value }} which is below the $3,000 support level."

      # Solana Price Alerts
      - alert: SolanaPriceAbove200
        expr: |
          SELECT close_price FROM ohlcv
          WHERE symbol = 'SOLUSDT'
          ORDER BY time DESC LIMIT 1
          > 200
        for: 1m
        labels:
          severity: warning
          symbol: SOLUSDT
          alert_type: price_high
        annotations:
          summary: "Solana price above $200"
          description: "Solana (SOL) is trading at ${{ $value }} which is above the $200 threshold."

      - alert: SolanaPriceBelow150
        expr: |
          SELECT close_price FROM ohlcv
          WHERE symbol = 'SOLUSDT'
          ORDER BY time DESC LIMIT 1
          < 150
        for: 5m
        labels:
          severity: critical
          symbol: SOLUSDT
          alert_type: price_low
        annotations:
          summary: "Solana price below $150"
          description: "Solana (SOL) has dropped to ${{ $value }} which is below the $150 support level."
