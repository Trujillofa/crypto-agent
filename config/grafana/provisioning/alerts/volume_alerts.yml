apiVersion: 1

groups:
  - name: crypto_volume_alerts
    interval: 30s
    rules:
      # Bitcoin Volume Spike
      - alert: BitcoinVolumeSpike
        expr: |
          SELECT AVG(volume) as avg_volume FROM ohlcv
          WHERE symbol = 'BTCUSDT' AND time >= NOW() - INTERVAL '1 hour'
        annotations:
          summary: "Bitcoin volume spike detected"
          description: "Bitcoin trading volume: ${{ $value }}"
        labels:
          severity: info
          symbol: BTCUSDT
          alert_type: volume_spike

      - alert: BitcoinVolumeAnomaly
        expr: |
          SELECT
            v2.volume,
            v1.avg_volume,
            (v2.volume::FLOAT / v1.avg_volume::FLOAT) as volume_ratio
          FROM (
            SELECT volume FROM ohlcv
            WHERE symbol = 'BTCUSDT'
            ORDER BY time DESC LIMIT 1
          ) v2
          CROSS JOIN (
            SELECT AVG(volume) as avg_volume FROM ohlcv
            WHERE symbol = 'BTCUSDT'
            AND time >= NOW() - INTERVAL '1 hour'
          ) v1
          WHERE (v2.volume::FLOAT / v1.avg_volume::FLOAT) > 2.5
        for: 1m
        labels:
          severity: warning
          symbol: BTCUSDT
          alert_type: volume_anomaly
        annotations:
          summary: "Bitcoin volume anomaly (2.5x above 1h average)"
          description: "Current volume: ${{ $value.volume }}, 1h average: ${{ $value.avg_volume }}"

      # Ethereum Volume Spike
      - alert: EthereumVolumeAnomaly
        expr: |
          SELECT
            v2.volume,
            v1.avg_volume,
            (v2.volume::FLOAT / v1.avg_volume::FLOAT) as volume_ratio
          FROM (
            SELECT volume FROM ohlcv
            WHERE symbol = 'ETHUSDT'
            ORDER BY time DESC LIMIT 1
          ) v2
          CROSS JOIN (
            SELECT AVG(volume) as avg_volume FROM ohlcv
            WHERE symbol = 'ETHUSDT'
            AND time >= NOW() - INTERVAL '1 hour'
          ) v1
          WHERE (v2.volume::FLOAT / v1.avg_volume::FLOAT) > 2.5
        for: 1m
        labels:
          severity: warning
          symbol: ETHUSDT
          alert_type: volume_anomaly
        annotations:
          summary: "Ethereum volume anomaly (2.5x above 1h average)"
          description: "Current volume: ${{ $value.volume }}, 1h average: ${{ $value.avg_volume }}"

      # Solana Volume Spike
      - alert: SolanaVolumeAnomaly
        expr: |
          SELECT
            v2.volume,
            v1.avg_volume,
            (v2.volume::FLOAT / v1.avg_volume::FLOAT) as volume_ratio
          FROM (
            SELECT volume FROM ohlcv
            WHERE symbol = 'SOLUSDT'
            ORDER BY time DESC LIMIT 1
          ) v2
          CROSS JOIN (
            SELECT AVG(volume) as avg_volume FROM ohlcv
            WHERE symbol = 'SOLUSDT'
            AND time >= NOW() - INTERVAL '1 hour'
          ) v1
          WHERE (v2.volume::FLOAT / v1.avg_volume::FLOAT) > 2.5
        for: 1m
        labels:
          severity: warning
          symbol: SOLUSDT
          alert_type: volume_anomaly
        annotations:
          summary: "Solana volume anomaly (2.5x above 1h average)"
          description: "Current volume: ${{ $value.volume }}, 1h average: ${{ $value.avg_volume }}"
