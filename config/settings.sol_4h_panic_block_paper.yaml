agent_id: sol-4h-panic-block-paper
display_name: sol-4h-panic-block-paper

trading:
  pairs:
    - SOLUSDT
  timeframe: 4h

ingest:
  use_websocket: false

trading_execution:
  enabled: false
  sl_atr_multiplier: 1.0
  tp_atr_multiplier: 3.0
  trailing_activate_atr: 2.5
  trailing_offset_atr: 1.5

futures:
  enabled: false
  symbols:
    - SOLUSDT

strategy:
  default_trading_mode: spot
  strategies:
    - name: panic_block_ma
      config:
        ema_short_period: 12
        ema_long_period: 26
        confidence_threshold: 0.6
        panic_rsi_threshold: 35.0
        panic_atr_pct_threshold: 0.08
        panic_require_below_ema200: true
  aggregator:
    min_agreement: 1
    buy_threshold: 0.45
    sell_threshold: -0.45
    btc_regime_filter_enabled: true
    btc_reference_symbol: BTCUSDT
    btc_dump_threshold_pct: -1.0
    btc_dump_require_below_ema200: true
