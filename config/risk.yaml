position_limits:
  max_position_pct: 0.10
  max_open_positions: 4

loss_limits:
  max_daily_loss_pct: 0.05
  max_drawdown_pct: 0.15
  max_single_loss_pct: 0.02

circuit_breakers:
  consecutive_losses: 3
  api_errors: 3
  latency_spike_ms: 5000

kill_switch:
  enabled: true
  telegram_confirm: true
  auto_reset_minutes: 60  # Auto-reset after 60 min cooldown (paper mode only, 0 = disabled)

futures_limits:
  max_leverage: 10  # Maximum allowed leverage (1-20, hard cap at 20)
  liquidation_buffer_pct: 5.0  # Block orders if within X% of liquidation
  max_daily_loss_pct: 5.0  # Separate futures daily loss limit
  max_margin_usage_pct: 50.0  # Warn if margin usage exceeds this threshold
  margin_mode: isolated  # isolated only for MVP (cross margin excluded)
  position_mode: one-way  # one-way only for MVP (hedge mode excluded)
