# Temporary config for MTF backtest testing
agent_id: mtf-test

trading:
  pairs:
    - BTCUSDT
  timeframe: 1h

ingest:
  use_websocket: false

database:
  host: localhost
  port: 15432

telegram:
  enabled: false

trading_execution:
  enabled: false

futures:
  symbols:
    - BTCUSDT

strategy:
  evaluation_interval_seconds: 3600
  strategies:
    - name: mtf_template
      config:
        regime_threshold: 0.005
        entry_pullback_pct: 0.01
        rsi_oversold: 40.0
        rsi_overbought: 60.0
        confidence_boost: 1.2
  aggregator:
    buy_threshold: 0.7
    buy_threshold_uptrend: 0.7
    sell_threshold: -0.6
    btc_regime_filter_enabled: false
    btc_reference_symbol: BTCUSDT
    btc_dump_threshold_pct: -1.0
    btc_dump_require_below_ema200: true
  per_symbol_aggregator_config: {}
