mode: paper
agent_id: autoresearch
log_level: INFO

trading:
  pairs:
    - SOLUSDT
  timeframe: 4h

ingest:
  use_websocket: false

database:
  host: 127.0.0.1
  port: 15432
  name: marketdata
  user: trading
  password: ""

telegram:
  enabled: false
  bot_token: ""
  chat_id: ""
  rate_limit_seconds: 5
  allowed_updates:
    - message

ai:
  enabled: false
  provider: xai
  model: grok-4-1-fast-reasoning
  polling_interval: 1.0
  max_history: 10
  allowed_chat_ids: []
  api_key: ""

prometheus:
  port: 8000

trading_execution:
  enabled: false
  api_key: ""
  api_secret: ""
  test_mode: true
  order_size_usdt: 100.0
  stop_loss_pct: 0.02
  take_profit_pct: 0.05
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 4.5
  trailing_activate_atr: 1.5
  trailing_offset_atr: 1.0
  use_atr_sizing: true
  atr_multiplier: 1.0
  risk_per_trade_pct: 0.02
  exit_rules:
    time_stop_minutes: 240

futures:
  enabled: false
  symbols:
    - SOLUSDT
  default_leverage: 3
  max_leverage: 10
  margin_mode: isolated
  position_mode: one-way
  test_mode: true
  liquidation_buffer_pct: 5.0

strategy:
  evaluation_interval_seconds: 14400
  cooldown_candles: 1
  default_trading_mode: futures
  strategies:
    - name: rsi_reversal
      config:
        rsi_period: 7
        oversold_threshold: 35
        overbought_threshold: 65
    - name: macd_histogram
      config:
        min_histogram_threshold: 0.0001
        use_atr_filter: true
        atr_min_pct: 0.003
    - name: bollinger_bounce
      config:
        band_distance_threshold: 0.003
        rsi_oversold: 35
        rsi_overbought: 65
    - name: cci_breakout
      config:
        cci_buy_threshold: 100
        cci_sell_threshold: -100
        atr_min_pct: 0.005
    - name: vwap_reversion
      config:
        vwap_atr_multiplier: 1.5
        rsi_oversold: 40
        rsi_overbought: 60
  global_trend_filter_enabled: true
  aggregator:
    min_agreement: 1
    buy_threshold: 0.8
    buy_threshold_uptrend: 0.8
    sell_threshold: -0.6
    btc_regime_filter_enabled: true
    btc_reference_symbol: BTCUSDT
    btc_dump_threshold_pct: -1.0
    btc_dump_require_below_ema200: true
  per_symbol_aggregator_config:
    SOLUSDT:
      min_agreement: 1
      buy_threshold: 0.8
      sell_threshold: -0.6
      sell_min_agreement: 2
    BNBUSDT:
      min_agreement: 1
      buy_threshold: 1.1
      sell_threshold: -0.5
