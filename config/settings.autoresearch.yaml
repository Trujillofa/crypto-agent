agent_id: autoresearch

trading:
  pairs:
    - SOLUSDT
  timeframe: 4h

ingest:
  use_websocket: false

database:
  host: 127.0.0.1
  port: 15432

telegram:
  enabled: false

trading_execution:
  enabled: false

futures:
  enabled: false

strategy:
  strategies:
    - name: rsi_reversal
      config:
        rsi_period: 7
        oversold_threshold: 35
        overbought_threshold: 65
    - name: macd_histogram
      config:
        min_histogram_threshold: 0.0001
        use_atr_filter: true
        atr_min_pct: 0.003
    - name: bollinger_bounce
      config:
        band_distance_threshold: 0.003
        rsi_oversold: 35
        rsi_overbought: 65
    - name: cci_breakout
      config:
        cci_buy_threshold: 100
        cci_sell_threshold: -100
        atr_min_pct: 0.005
    - name: vwap_reversion
      config:
        vwap_atr_multiplier: 1.5
        rsi_oversold: 40
        rsi_overbought: 60
  aggregator:
    buy_threshold: 0.8
    buy_threshold_uptrend: 0.8
    sell_threshold: -0.6
    btc_regime_filter_enabled: true
    btc_reference_symbol: BTCUSDT
    btc_dump_threshold_pct: -1.0
    btc_dump_require_below_ema200: true
  per_symbol_aggregator_config:
    SOLUSDT:
      min_agreement: 1
      buy_threshold: 0.8
      sell_threshold: -0.6
      sell_min_agreement: 2
    BNBUSDT:
      min_agreement: 1
      buy_threshold: 1.1
      sell_threshold: -0.5
