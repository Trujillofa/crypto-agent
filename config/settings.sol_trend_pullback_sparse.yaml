mode: paper
agent_id: sol-trend-pullback-sparse
log_level: INFO

trading:
  pairs:
    - SOLUSDT
  timeframe: 4h

ingest:
  use_websocket: true

database:
  host: timescaledb
  port: 5432
  name: marketdata
  user: trading
  password: ""

telegram:
  enabled: true
  bot_token: ""  # Set via TELEGRAM_BOT_TOKEN env var
  chat_id: ""    # Set via TELEGRAM_CHAT_ID env var
  rate_limit_seconds: 5
  allowed_updates:
    - message

ai:
  enabled: false
  provider: xai
  model: grok-4-1-fast-reasoning
  polling_interval: 1.0
  max_history: 10
  allowed_chat_ids: []
  api_key: ""

prometheus:
  port: 8000

trading_execution:
  enabled: true
  api_key: ""
  api_secret: ""
  test_mode: true
  order_size_usdt: 100.0
  stop_loss_pct: 0.02
  take_profit_pct: 0.05
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 4.5
  trailing_activate_atr: 1.5
  trailing_offset_atr: 1.0
  use_atr_sizing: true
  atr_multiplier: 1.0
  risk_per_trade_pct: 0.02
  exit_rules:
    backtest_use_executor_exit_model: true
    backtest_ignore_signal_sells: true

futures:
  enabled: true
  symbols:
    - SOLUSDT
  default_leverage: 3
  max_leverage: 10
  margin_mode: isolated
  position_mode: one-way
  test_mode: true
  liquidation_buffer_pct: 5.0

strategy:
  evaluation_interval_seconds: 14400
  cooldown_candles: 1
  default_trading_mode: futures
  strategies:
    - name: trend_pullback
      config:
        rsi_reclaim_level: 48
        min_trend_strength_pct: 0.008
        max_pullback_distance_pct: 0.02
        vwap_pullback_distance_pct: 0.03
        min_atr_pct: 0.008
        min_macd_hist: -0.01
        strong_trend_strength_pct: 0.015
        continuation_rsi_level: 54
        continuation_max_vwap_distance_pct: 0.04
        continuation_max_ema50_extension_pct: 0.03
        continuation_min_macd_hist: -0.01
  aggregator:
    min_agreement: 1
    buy_threshold: 0.45
    buy_threshold_uptrend: 0.45
    sell_threshold: -1.0
