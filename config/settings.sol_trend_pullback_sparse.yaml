agent_id: sol-trend-pullback-sparse
display_name: sol-4h-trend-pullback-sparse

# Reverted to paper: spot account has $0 USDT balance (2026-04-25).
# Re-enable once account is funded. Previous live config: $6/trade, ~$43 balance.
mode: paper

trading:
  pairs:
    - SOLUSDT
  timeframe: 4h

telegram:
  daily_summary_enabled: true

trading_execution:
  test_mode: true
  use_atr_sizing: false
  order_size_usdt: 6.0
  exit_rules:
    backtest_use_executor_exit_model: true
    backtest_ignore_signal_sells: true

futures:
  enabled: false

strategy:
  default_trading_mode: spot
  strategies:
    - name: trend_pullback
      config:
        rsi_reclaim_level: 48
        min_trend_strength_pct: 0.008
        max_pullback_distance_pct: 0.02
        vwap_pullback_distance_pct: 0.03
        min_atr_pct: 0.008
        min_macd_hist: -0.01
        strong_trend_strength_pct: 0.015
        continuation_rsi_level: 54
        continuation_max_vwap_distance_pct: 0.04
        continuation_max_ema50_extension_pct: 0.03
        continuation_min_macd_hist: -0.01
  aggregator:
    buy_threshold: 0.45
    buy_threshold_uptrend: 0.45
    sell_threshold: -1.0
    btc_regime_filter_enabled: false

# Temporary: Use REST for backfill
ingest:
  use_websocket: false
