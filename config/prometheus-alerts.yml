groups:
  - name: trading-agent-resilience
    rules:
      - alert: WebSocketStale
        expr: max by (instance, stream) (ingest_websocket_last_message_age_seconds{job="trading-agent"}) > 240
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "WebSocket stream stale ({{ $labels.stream }})"
          description: "No websocket messages for >240s (2x expected 120s staleness window) on {{ $labels.instance }}."

      - alert: WebSocketReconnectSpike
        expr: increase(ingest_websocket_reconnects_total{job="trading-agent"}[5m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "WebSocket reconnect spike ({{ $labels.stream }})"
          description: "More than 3 reconnects in 5 minutes on {{ $labels.instance }}."

      - alert: ApiRateLimitHeadroomLow
        expr: (ingest_api_rate_limit_remaining{job="trading-agent"} / 2400) < 0.2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API rate-limit headroom low"
          description: "Remaining Binance API weight is below 20% on {{ $labels.instance }}."

  - name: infrastructure-coverage
    rules:
      # Still in file_sd, scrape failing. Labels agent_id and service come from agents.json.
      - alert: AgentDown
        expr: up{job="trading-agent"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Trading agent DOWN ({{ $labels.service }})"
          description: "Agent {{ $labels.agent_id }} ({{ $labels.instance }}) has been unreachable for 2 minutes."

      # Dropped out of file_sd. timestamp(up) cannot see a series that is already gone.
      # Ids mirror config/prometheus/agents.json.
      - alert: ScrapeTargetGone
        expr: |
          absent(up{job="trading-agent",agent_id="sol-trend-pullback-sparse"})
          or absent(up{job="trading-agent",agent_id="sentiment-macro-bot"})
          or absent(up{job="trading-agent",agent_id="sol-4h-panic-block-paper"})
          or absent(up{job="trading-agent",agent_id="sol-1h-trend-pullback-overlay-live"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "A trading-agent scrape target vanished"
          description: "One configured file_sd agent is missing from up{job=\"trading-agent\"}: sol-trend-pullback-sparse, sentiment-macro-bot, sol-4h-panic-block-paper, sol-1h-trend-pullback-overlay-live."

      # pg_up is emitted by postgres-exporter (job "postgres-exporter"). It is 1
      # while the exporter can reach marketdata, 0 when the connection fails.
      # pg_up == 0 (not absent()) means the exporter itself is up but the
      # database is unreachable — the dead-DB case that was previously invisible.
      - alert: TimescaleDown
        expr: pg_up{job="postgres-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "crypto-agent TimescaleDB DOWN ({{ $labels.instance }})"
          description: "postgres-exporter reports pg_up=0; the marketdata database is unreachable from {{ $labels.instance }}."

      # Complementary to TimescaleDown: the exporter itself is not scraped at
      # all, so pg_up has no series and TimescaleDown cannot fire. Mirrors the
      # AgentDown up==0 pattern above.
      - alert: PostgresExporterDown
        expr: up{job="postgres-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "postgres-exporter DOWN ({{ $labels.instance }})"
          description: "The postgres-exporter target is unreachable; database uptime is not being monitored."

      # Closed-candle writes only. A healthy 1h agent is silent for ~3600s and a healthy
      # 4h agent for ~14400s, so a flat 1800s threshold would page through every normal bar.
      # for: 5m requires the close to be missed by 5 minutes. No absent(): a process that
      # has not written yet has no sample, and absent() would page until that first write.
      # Ids and bar lengths mirror the four file_sd agents.
      - alert: IngestionStale
        expr: |
          ingest_db_last_write_age_seconds{job="trading-agent",agent_id=~"^(sol-1h-trend-pullback-overlay-live|sentiment-macro-bot)$"} > 3600
          or ingest_db_last_write_age_seconds{job="trading-agent",agent_id=~"^(sol-trend-pullback-sparse|sol-4h-panic-block-paper)$"} > 14400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB ingestion stale ({{ $labels.service }})"
          description: "Agent {{ $labels.agent_id }} ({{ $labels.instance }}) missed its candle-close database write. 1h agents page after 3600s plus 5m; 4h agents page after 14400s plus 5m."

      # Offsite backup staleness.
      #
      # The local backup is only a real backup if a copy of it exists somewhere
      # else. offsite-backup.sh writes a last-success sentinel after every
      # VERIFIED copy; the metric script turns that into a gauge. If the peer
      # is offline for a week, the unit skips every night and -- without this
      # alert -- nothing at all would say so.
      #
      # 2 days is deliberately twice the 24h timer period, so a single missed
      # run does not page, but two consecutive misses do.
      - alert: OffsiteBackupStale
        expr: offsite_backup_never_succeeded == 1 or offsite_backup_last_success_age_seconds > 172800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Offsite backup has not succeeded recently"
          description: "No verified offsite backup copy in over 48h (or none ever). The local backup is the only copy. Check 'journalctl -u crypto-agent-offsite-backup' and the peer."

      - alert: OffsiteBackupFailing
        expr: increase(offsite_backup_failures_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Offsite backup failed ({{ $labels.instance }})"
          description: "An offsite backup run failed in the last hour on {{ $labels.instance }}. The local copy exists but there is no verified offsite copy."

      # ------------------------------------------------------------------
      # Indicator layer.
      #
      # The indicator layer is where both of this system's worst defects
      # lived (a frozen forming-candle value, and a silent drift between
      # four writers), and until now NOTHING monitored it. The alerts below
      # cover the failure modes that are invisible in the table itself.
      # ------------------------------------------------------------------

      # ROOT CAUSE: the ingest layer wrote a candle that had not closed.
      #
      # This is where the original defect actually started: the REST
      # poller wrote the in-progress kline into the source ohlcv table.
      # The computer now skips forming rows when publishing, so this never
      # reaches the indicators table -- but the SOURCE table is wrong, and
      # the next writer (or a backfill) may pick it up.
      #
      # A bar is forming for the WHOLE of its period -- a 4h bar is
      # legitimately open for four hours. So a FIXED threshold would fire
      # constantly on 4h pairs and never on a stuck 1h pair.
      #
      # The comparison is exact instead: a forming bar is only anomalous
      # once it has been open for LONGER than its own period, because by
      # then it should have closed. A 4h bar that has been open for 5h is
      # stuck; a 4h bar that has been open for 3h is perfectly normal.
      - alert: SourceOhlcvFormingBarLingering
        expr: |
          indicator_source_newest_bar_was_forming == 1
          and indicator_published_bar_period_seconds > 0
          and indicator_source_newest_bar_forming_for_seconds > indicator_published_bar_period_seconds
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Source OHLCV still holds a forming candle ({{ $labels.symbol }} {{ $labels.timeframe }})"
          description: "The newest row in the source ohlcv table has been open for longer than its bar period, so it should have closed by now. Either the ingest poller is not advancing, or it is stuck writing a bar that never completes. The indicator layer skips forming rows, so the indicators are not affected directly -- but the source table is wrong."

      # A bar was published before it finished forming.
      #
      # The live path writes only the newest bar, and it never revisits an
      # old row. So a bar written while still forming is frozen at a
      # partial value FOREVER: no later computation corrects it, and the
      # row looks like any other row. The only way to see it is to compare
      # the bar's own close_time against the moment of publication -- a
      # negative age.
      #
      # indicator_published_bar_was_forming is the 0/1 version of that
      # comparison, so the alert does not depend on a sign.
      - alert: IndicatorPublishedFormingBar
        expr: indicator_published_bar_was_forming == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Forming candle published as an indicator ({{ $labels.symbol }} {{ $labels.timeframe }})"
          description: "The indicator computer published a bar that had not closed yet. Because the live path only ever writes the newest bar and never revisits an old one, that row is frozen at a partial value permanently. Check the ingest poller is not writing the in-progress kline."

      # The published indicator bar is far older than it should be.
      #
      # Staleness is measured in BAR PERIODS, not wall-clock seconds: a 4h
      # pair's newest published bar is naturally up to four hours old, so
      # a fixed "older than 1h" threshold would fire constantly for every
      # 4h pair. "More than 2 bar periods old" means the same thing for
      # every timeframe.
      #
      # Normally the age is the delay between a bar closing and the
      # computer writing it -- seconds to a couple of minutes. Exceeding
      # two periods means the computer stopped advancing, or it is stuck
      # on an old bar while the market moves on. That is the "drift"
      # condition: the table looks populated, and every row is quietly
      # out of date.
      - alert: IndicatorPublishedBarStale
        expr: indicator_published_bar_age_seconds > 2 * indicator_published_bar_period_seconds
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Indicator bar is stale ({{ $labels.symbol }} {{ $labels.timeframe }})"
          description: "The newest published indicator bar is more than 2 bar periods old. The table looks populated but is drifting out of date. Check the indicator computer loop."

      # The indicator computation loop is not running.
      - alert: IndicatorComputationStopped
        expr: indicator_computation_running == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Indicator computation loop stopped ({{ $labels.instance }})"
          description: "The indicator computer reports it is not running. Indicators in the table are frozen at their last computed values. Check the agent logs."

      # A pair that HAS published before has stopped publishing.
      #
      # The universe of pairs that should have indicators is not fixed
      # enough to assert a count, so this is deliberately narrow: it fires
      # only when a pair that published before has published nothing for a
      # long time. That is the "the computer is alive but wedged on this
      # pair" case. The threshold is in bar periods too, so a 4h pair is
      # given proportionally more room than a 1h pair.
      - alert: IndicatorPairStoppedPublishing
        expr: indicator_published_bar_timestamp_seconds > 0 and (time() - indicator_published_bar_timestamp_seconds) > 24 * indicator_published_bar_period_seconds
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Indicator pair stopped publishing ({{ $labels.symbol }} {{ $labels.timeframe }})"
          description: "This pair published indicators more than 24 bar periods ago and has published nothing since. The rows for this pair are frozen."
