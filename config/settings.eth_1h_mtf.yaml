# ETHUSDT Multi-Timeframe backtest config
# Entry: 1h, Regime: 4h (declared in strategy REQUIRED_TIMEFRAMES)
mode: paper
agent_id: eth-mtf-backtest
log_level: INFO

trading:
  pairs:
    - ETHUSDT
  timeframe: 1h

ingest:
  use_websocket: false

database:
  host: localhost
  port: 15432
  name: marketdata
  user: trading
  password: ""

telegram:
  enabled: false

ai:
  enabled: false

prometheus:
  port: 8000

trading_execution:
  enabled: false
  api_key: ""
  api_secret: ""
  test_mode: true
  order_size_usdt: 100.0
  stop_loss_pct: 0.02
  take_profit_pct: 0.05
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 4.5
  trailing_activate_atr: 1.5
  trailing_offset_atr: 1.0
  use_atr_sizing: true
  atr_multiplier: 1.0
  risk_per_trade_pct: 0.02
  exit_rules:
    time_stop_minutes: 720
    backtest_use_executor_exit_model: true
    backtest_ignore_signal_sells: true

futures:
  enabled: true
  symbols:
    - ETHUSDT
  default_leverage: 3
  max_leverage: 10
  margin_mode: isolated
  position_mode: one-way
  test_mode: true
  liquidation_buffer_pct: 5.0

strategy:
  evaluation_interval_seconds: 3600
  cooldown_candles: 1
  default_trading_mode: futures
  strategies:
    - name: multi_timeframe_regime
      config:
        trend_strength_threshold: 0.005
        volatility_percentile_threshold: 60.0
        trend_consistency_threshold: 60.0
        rsi_slope_threshold: 5.0
        entry_window_bars: 6
        pullback_threshold: 0.01
        reclaim_threshold: 0.005
        entry_zone_pct: 0.01
        deep_pullback_pct: 0.02
        rsi_oversold: 45.0
        rsi_overbought: 55.0
        trending_confidence: 1.2
        ranging_confidence: 1.0
        uncertain_confidence: 0.0
        futures_enabled: true
  global_trend_filter_enabled: true
  aggregator:
    min_agreement: 1
    buy_threshold: 0.7
    buy_threshold_uptrend: 0.7
    sell_threshold: -0.6
    btc_regime_filter_enabled: false
    btc_reference_symbol: BTCUSDT
    btc_dump_threshold_pct: -1.0
    btc_dump_require_below_ema200: true
  per_symbol_aggregator_config: {}
