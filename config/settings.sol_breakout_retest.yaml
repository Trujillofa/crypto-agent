mode: paper
agent_id: sol-breakout-retest
log_level: INFO

trading:
  pairs:
    - SOLUSDT
  timeframe: 4h

ingest:
  use_websocket: true

database:
  host: timescaledb
  port: 5432
  name: marketdata
  user: trading
  password: ""

telegram:
  enabled: false
  bot_token: ""
  chat_id: ""
  rate_limit_seconds: 5
  allowed_updates:
    - message

ai:
  enabled: false
  provider: xai
  model: grok-4-1-fast-reasoning
  polling_interval: 1.0
  max_history: 10
  allowed_chat_ids: []
  api_key: ""

prometheus:
  port: 8000

trading_execution:
  enabled: true
  api_key: ""
  api_secret: ""
  test_mode: true
  order_size_usdt: 100.0
  stop_loss_pct: 0.02
  take_profit_pct: 0.05
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 4.5
  trailing_activate_atr: 1.5
  trailing_offset_atr: 1.0
  use_atr_sizing: true
  atr_multiplier: 1.0
  risk_per_trade_pct: 0.02
  exit_rules:
    backtest_use_executor_exit_model: true
    backtest_ignore_signal_sells: true

futures:
  enabled: true
  symbols:
    - SOLUSDT
  default_leverage: 3
  max_leverage: 10
  margin_mode: isolated
  position_mode: one-way
  test_mode: true
  liquidation_buffer_pct: 5.0

strategy:
  evaluation_interval_seconds: 14400
  cooldown_candles: 1
  default_trading_mode: futures
  strategies:
    - name: breakout_retest
      config:
        min_trend_strength_pct: 0.008
        min_atr_pct: 0.008
        breakout_rsi_level: 58
        breakout_min_macd_hist: 0.0
        breakout_band_distance_threshold: 0.01
        breakout_min_vwap_extension_pct: 0.01
        retest_window_bars: 4
        retest_vwap_distance_pct: 0.015
        retest_ema50_distance_pct: 0.015
        reclaim_rsi_level: 50
        retest_min_macd_hist: -0.01
        max_extension_after_retest_pct: 0.025
  aggregator:
    min_agreement: 1
    buy_threshold: 0.45
    buy_threshold_uptrend: 0.45
    sell_threshold: -1.0
