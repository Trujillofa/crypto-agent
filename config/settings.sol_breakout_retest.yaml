agent_id: sol-breakout-retest

trading:
  pairs:
    - SOLUSDT
  timeframe: 4h

telegram:
  enabled: false

trading_execution:
  exit_rules:
    backtest_use_executor_exit_model: true
    backtest_ignore_signal_sells: true

futures:
  symbols:
    - SOLUSDT

strategy:
  strategies:
    - name: breakout_retest
      config:
        min_trend_strength_pct: 0.008
        min_atr_pct: 0.008
        breakout_rsi_level: 58
        breakout_min_macd_hist: 0.0
        breakout_band_distance_threshold: 0.01
        breakout_min_vwap_extension_pct: 0.01
        retest_window_bars: 4
        retest_vwap_distance_pct: 0.015
        retest_ema50_distance_pct: 0.015
        reclaim_rsi_level: 50
        retest_min_macd_hist: -0.01
        max_extension_after_retest_pct: 0.025
  aggregator:
    buy_threshold: 0.45
    buy_threshold_uptrend: 0.45
    sell_threshold: -1.0
