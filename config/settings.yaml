mode: paper
agent_id: default
log_level: INFO

trading:
  pairs:
    - SOLUSDT
  timeframe: 4h

ingest:
  use_websocket: true

database:
  host: timescaledb
  port: 5432
  name: marketdata
  user: trading
  password: ""

telegram:
  enabled: true
  bot_token: ""  # Set via TELEGRAM_BOT_TOKEN env var
  chat_id: ""    # Set via TELEGRAM_CHAT_ID env var
  rate_limit_seconds: 5
  allowed_updates:
    - message

ai:
  enabled: true
  provider: xai
  model: grok-4-1-fast-reasoning
  polling_interval: 1.0
  max_history: 10
  allowed_chat_ids: []
  api_key: ""

prometheus:
  port: 8000

trading_execution:
  enabled: true  # Futures demo trading via demo-fapi.binance.com
  api_key: ""  # Set via BINANCE_API_KEY environment variable
  api_secret: ""  # Set via BINANCE_API_SECRET environment variable
  test_mode: true  # Set to false for live trading
  order_size_usdt: 100.0  # 1% of $10k paper balance
  # Fixed SL/TP as fallback only (ATR-based is primary)
  stop_loss_pct: 0.02
  take_profit_pct: 0.05
  # ATR-based SL/TP (primary)
  sl_atr_multiplier: 2.0   # SL = entry - 2.0 * ATR(14)
  tp_atr_multiplier: 4.5   # TP = entry + 4.5 * ATR(14)
  trailing_activate_atr: 1.5  # activate trailing after +1.5 * ATR profit
  trailing_offset_atr: 1.0    # trail SL at highest - 1.0 * ATR
  # ATR-based position sizing
  use_atr_sizing: true         # size by (equity × risk_pct) / (atr × multiplier) instead of flat USDT
  atr_multiplier: 1.0          # stop distance multiplier for sizing calc
  risk_per_trade_pct: 0.02     # 2% of current equity risked per trade
  exit_rules:
    time_stop_minutes: 240      # align with 4h strategy cadence (avoid 60m forced exits)

futures:
  enabled: true  # Futures demo trading enabled
  symbols:
    - SOLUSDT
  default_leverage: 3  # Conservative default
  max_leverage: 10  # Configurable max (hard cap 20x enforced in code)
  margin_mode: isolated  # isolated only for MVP
  position_mode: one-way  # one-way only for MVP
  test_mode: true  # Use demo.binance.com for paper trading
  liquidation_buffer_pct: 5.0  # Block orders if within 5% of liquidation price

strategy:
  evaluation_interval_seconds: 14400
  cooldown_candles: 1
  default_trading_mode: futures  # "spot" or "futures" - determines where signals are routed
  strategies:
    - name: rsi_reversal
      config:
        rsi_period: 7
        oversold_threshold: 35
        overbought_threshold: 65
    - name: macd_histogram
      config:
        min_histogram_threshold: 0.0001
        use_atr_filter: true
        atr_min_pct: 0.003
    - name: bollinger_bounce
      config:
        band_distance_threshold: 0.003
        rsi_oversold: 35
        rsi_overbought: 65
    - name: cci_breakout
      config:
        cci_buy_threshold: 100
        cci_sell_threshold: -100
        atr_min_pct: 0.005
    - name: vwap_reversion
      config:
        vwap_atr_multiplier: 1.5
        rsi_oversold: 40
        rsi_overbought: 60
  global_trend_filter_enabled: true  # block BUY when price < EMA200; set false to allow trend-counter entries
  aggregator:
    min_agreement: 1
    buy_threshold: 0.8          # conservative paper-mode lowering to admit strong single-strategy votes
    buy_threshold_uptrend: 0.8  # keep aligned with base threshold while validating live signal flow
    sell_threshold: -0.6
    btc_regime_filter_enabled: true
    btc_reference_symbol: BTCUSDT
    btc_dump_threshold_pct: -1.0
    btc_dump_require_below_ema200: true
  # Per-symbol aggregator overrides (key = symbol, value = aggregator config)
  # These override the global aggregator settings for specific symbols
  per_symbol_aggregator_config:
    SOLUSDT:
      min_agreement: 1
      buy_threshold: 0.8
      sell_threshold: -0.6
      sell_min_agreement: 2     # require at least two SELL voters before opening futures shorts
    BNBUSDT:
      min_agreement: 1
      buy_threshold: 1.1
      sell_threshold: -0.5
