mode: paper
log_level: INFO

trading:
  pairs:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - BNBUSDT
    - ADAUSDT
    - XRPUSDT
    - DOTUSDT
    - DOGEUSDT
    - AVAXUSDT
    - LINKUSDT
  timeframe: 1m

ingest:
  use_websocket: true

database:
  host: timescaledb
  port: 5432
  name: marketdata
  user: trading
  password: ""

telegram:
  enabled: true
  bot_token: ""  # Set via TELEGRAM_BOT_TOKEN env var
  chat_id: ""    # Set via TELEGRAM_CHAT_ID env var
  rate_limit_seconds: 5
  allowed_updates:
    - message

ai:
  enabled: true
  provider: xai
  model: grok-4-1-fast-reasoning
  polling_interval: 1.0
  max_history: 10
  allowed_chat_ids: []
  api_key: ""

prometheus:
  port: 8000

trading_execution:
  enabled: true  # Paper trading enabled
  api_key: ""  # Set via BINANCE_API_KEY environment variable
  api_secret: ""  # Set via BINANCE_API_SECRET environment variable
  test_mode: true  # Set to false for live trading
  order_size_usdt: 50.0  # Default order size in USDT

futures:
  enabled: true  # Futures demo trading enabled
  symbols:
    - BTCUSDT
    - ETHUSDT
  default_leverage: 3  # Conservative default
  max_leverage: 10  # Configurable max (hard cap 20x enforced in code)
  margin_mode: isolated  # isolated only for MVP
  position_mode: one-way  # one-way only for MVP
  test_mode: true  # Use demo.binance.com for paper trading
  liquidation_buffer_pct: 5.0  # Block orders if within 5% of liquidation price

strategy:
  evaluation_interval_seconds: 30
  default_trading_mode: spot  # "spot" or "futures" - determines where signals are routed
  strategies:
    - name: simple_ma
      config:
        ema_short_period: 12
        ema_long_period: 26
    - name: rsi_reversal
      config:
        rsi_period: 14
        oversold_threshold: 45
        overbought_threshold: 55
    - name: macd_histogram
      config:
        min_histogram_threshold: 0.0
        use_atr_filter: false
    - name: bollinger_bounce
      config:
        band_distance_threshold: 0.005
        rsi_oversold: 45
        rsi_overbought: 55
    - name: momentum
      config:
        rsi_buy_threshold: 48
        rsi_sell_threshold: 52
        rsi_max_entry: 80
        rsi_min_entry: 20
  aggregator:
    min_agreement: 2
    buy_threshold: 0.6
    sell_threshold: -0.6
