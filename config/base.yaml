mode: paper
log_level: INFO

ingest:
  use_websocket: true

database:
  host: timescaledb
  port: 5432
  name: marketdata
  user: trading
  password: ""

telegram:
  enabled: true
  daily_summary_enabled: false
  daily_summary_send_empty: false
  bot_token: ""
  chat_id: ""
  rate_limit_seconds: 5
  allowed_updates:
    - message

ai:
  enabled: false
  provider: xai
  model: grok-4-1-fast-reasoning
  polling_interval: 1.0
  max_history: 10
  allowed_chat_ids: []
  api_key: ""

prometheus:
  port: 8000

trading_execution:
  enabled: true
  api_key: ""
  api_secret: ""
  test_mode: true
  order_size_usdt: 100.0
  stop_loss_pct: 0.02
  take_profit_pct: 0.05
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 4.5
  trailing_activate_atr: 1.5
  trailing_offset_atr: 1.0
  use_atr_sizing: true
  atr_multiplier: 1.0
  risk_per_trade_pct: 0.02
  exit_rules:
    time_stop_minutes: 240

futures:
  enabled: true
  symbols: []
  default_leverage: 3
  max_leverage: 10
  margin_mode: isolated
  position_mode: one-way
  test_mode: true
  liquidation_buffer_pct: 5.0

strategy:
  evaluation_interval_seconds: 14400
  cooldown_candles: 1
  default_trading_mode: futures
  strategies: []
  global_trend_filter_enabled: true
  global_trend_filter_buffer_pct: 0.05
  aggregator:
    min_agreement: 1
    buy_threshold: 0.5
    buy_threshold_uptrend: 0.5
    sell_threshold: -0.5
    min_confidence: 0.0
