[project]
name = "chub"
version = "0.1.0"
description = "Context Hub CLI — search and retrieve LLM-optimized docs and skills"
readme = "SPEC.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.25.0",
    "PyYAML>=6.0.0",
]

[project.scripts]
chub = "src.chub.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
